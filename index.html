<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello, world!</title>
  <meta name="description" content="Hello, world!">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://raschet2.github.io/fin/">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-deep: #0b1f1c;
      --bg-mid: #14352f;
      --fog: #c8e6d9;
      --ink: #e8f5ef;
      --muted: rgba(232, 245, 239, 0.72);
      --accent: #f0a35e;
      --accent-soft: rgba(240, 163, 94, 0.22);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
    }

    body {
      min-height: 100dvh;
      color: var(--ink);
      font-family: "Manrope", sans-serif;
      background:
        radial-gradient(1200px 700px at 15% 10%, rgba(61, 120, 104, 0.55), transparent 55%),
        radial-gradient(900px 600px at 85% 85%, rgba(240, 163, 94, 0.18), transparent 50%),
        linear-gradient(160deg, var(--bg-deep), var(--bg-mid) 55%, #0e2823);
      overflow: hidden;
    }

    .atmosphere {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(232, 245, 239, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(232, 245, 239, 0.035) 1px, transparent 1px);
      background-size: 72px 72px;
      mask-image: radial-gradient(ellipse at center, black 35%, transparent 80%);
      animation: drift 18s linear infinite;
    }

    .glow {
      position: fixed;
      width: 42vw;
      height: 42vw;
      min-width: 280px;
      min-height: 280px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--accent-soft), transparent 70%);
      filter: blur(10px);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -48%);
      animation: pulse 5.5s ease-in-out infinite;
      pointer-events: none;
    }

    main {
      position: relative;
      z-index: 1;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 2rem;
      text-align: center;
    }

    .brand {
      font-family: "Instrument Serif", Georgia, serif;
      font-size: clamp(4.5rem, 16vw, 9.5rem);
      line-height: 0.92;
      letter-spacing: -0.03em;
      font-weight: 400;
      opacity: 0;
      transform: translateY(18px);
      animation: rise 900ms cubic-bezier(0.22, 1, 0.36, 1) 120ms forwards;
    }

    .brand em {
      font-style: italic;
      color: var(--fog);
    }

    .lede {
      margin-top: 1.25rem;
      max-width: 28ch;
      margin-inline: auto;
      font-size: clamp(1rem, 2.4vw, 1.2rem);
      font-weight: 400;
      color: var(--muted);
      opacity: 0;
      transform: translateY(14px);
      animation: rise 900ms cubic-bezier(0.22, 1, 0.36, 1) 280ms forwards;
    }

    .cta {
      margin-top: 2rem;
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      padding: 0.85rem 1.35rem;
      border: 1px solid rgba(232, 245, 239, 0.22);
      background: rgba(11, 31, 28, 0.35);
      color: var(--ink);
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
      letter-spacing: 0.01em;
      backdrop-filter: blur(8px);
      transition: border-color 200ms ease, background 200ms ease, transform 200ms ease;
      opacity: 0;
      transform: translateY(14px);
      animation: rise 900ms cubic-bezier(0.22, 1, 0.36, 1) 440ms forwards;
    }

    .cta:hover {
      border-color: rgba(240, 163, 94, 0.7);
      background: rgba(240, 163, 94, 0.12);
      transform: translateY(-1px);
    }

    .cta span {
      color: var(--accent);
      transition: transform 200ms ease;
    }

    .cta:hover span {
      transform: translateX(3px);
    }

    @keyframes rise {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.55; transform: translate(-50%, -48%) scale(1); }
      50% { opacity: 0.95; transform: translate(-50%, -48%) scale(1.08); }
    }

    @keyframes drift {
      from { background-position: 0 0, 0 0; }
      to { background-position: 72px 72px, 72px 72px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .atmosphere, .glow, .brand, .lede, .cta {
        animation: none;
        opacity: 1;
        transform: none;
      }
    }
  </style>
</head>
<body>
  <div class="atmosphere" aria-hidden="true"></div>
  <div class="glow" aria-hidden="true"></div>
  <main>
    <div>
      <h1 class="brand">Hello, <em>world!</em></h1>
      <p class="lede">Простая стартовая страница. Всё работает.</p>
      <a class="cta" href="https://github.com/raschet2/fin" target="_blank" rel="noopener noreferrer">
        Открыть репозиторий <span aria-hidden="true">→</span>
      </a>
    </div>
  </main>
</body>
</html>
